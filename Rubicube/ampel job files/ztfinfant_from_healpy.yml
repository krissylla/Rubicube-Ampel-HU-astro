name: classificationFromToken

mongo:
  prefix: live_ztf_infant
  reset: true

channel:
- name: ztfrealtimeclass
  access: [ZTF, ZTF_PUB, ZTF_PRIV]
  policy: []


task:

- title: token
  unit: T4Processor
  config:
    raise_exc: true
    execute:
    - unit: T4RunTimeContextUpdater
      config:
        execute:
        - unit: HealpixTokenGenerator
          config:
            pvalue_limit: 0.9
            map_name: IceCube-260115A_skymap_probdensity_multiorder.fits.gz
            map_url: https://roc-2.icecube.wisc.edu/public/alerts/IceCube-260115A_skymap_probdensity_multiorder.fits.gz
            map_dir: /Users/cristozilleruelo/Ampel-HU-astro/RubiCube/ic_alerts_temp
            date_str: '2026-01-15'
            delta_time: 10.0
            archive_token:
              label: ztf/archive/token
            candidate:
              jdstarthist: 
                $gt: '2026-01-05'

- title: filter
  template:
    live:
      - resolve_run_time_aliases
      - hash_t2_config
  unit: AlertConsumer
  config:
    iter_max: 100000000
    supplier:
      unit: ZiAlertSupplier
      config:
        deserialize: null
        loader:
          unit: ZTFArchiveAlertLoader
          config:
            stream: "%%IceCube-260115A_skymap_probdensity_multiorder.fits.gz_token"
    shaper: ZiDataPointShaper
    compiler_opts: '%ZiCompilerOptionsAlias'
    directives:
    - channel: ztfrealtimeclass
      filter:
        config:
          gaia_excessnoise_sig_max: 999
          gaia_plx_signif: 3
          gaia_pm_signif: 3 #we want below this
          gaia_rs: 20
          gaia_veto_gmag_max: 20
          gaia_veto_gmag_min: 9
          min_ndet: 1 #0
          min_tspan: -1 #0
          max_tspan: 365 #5
          min_archive_tspan: 0
          max_archive_tspan: 365 #5
          min_gal_lat: -1.0 #14
          min_rb: 0.0 #0.3
          min_sso_dist: 20
          ps1_confusion_rad: 3 #pansars catalogue
          ps1_confusion_sg_tol: 0.1
          ps1_sgveto_rad: 1
          ps1_sgveto_th: 0.8
          max_fwhm: 5.5
          max_elong: 1.4
          max_magdiff: 1.0 #0.4
          max_nbad: 2 #0
        on_stock_match: bypass
        unit: DecentFilter
      ingest:
        mux:
          unit: ZiArchiveMuxer
          config:
            history_days: 999
            future_days: 999
          insert:
            point_t2:
            # - config: &dl_config
            #     datalab_user: 
            #       label: datalab/user
            #     datalab_pwd: 
            #       label: datalab/password
            #   ingest:
            #     filter: PPSFilter
            #     select: first
            #     sort: jd
            #   unit: T2LSPhotoZTap
            - config: '%T2CatalogMatch_general'
              ingest:
                filter: PPSFilter
                select: first
                sort: jd
              unit: T2CatalogMatch
          combine:
          - state_t2:
            - unit: T2LightCurveSummary
            - config: &risedec_config
                significant_bands:
                - ztfg
                - ztfr
                - ztfi
                t_cadence: 3
                tabulator:
                - unit: ZTFT2Tabulator
              unit: T2TabulatorRiseDecline
            - unit: T2DigestRedshifts
              config: &digest_config
                max_redshift_category: 7
                t2_dependency:
                - config: '%T2CatalogMatch_general'
                  link_override:
                    filter: PPSFilter
                    select: first
                    sort: jd
                  unit: T2CatalogMatch #stored in zeuthen
                # - config: *dl_config
                #   link_override:
                #     filter: PPSFilter
                #     select: first
                #     sort: jd
                #   unit: T2LSPhotoZTap
            - unit: T2InfantReport
              config: 
                report_t2s:
                - T2DigestRedshifts
                - T2TabulatorRiseDecline
                tabulator:
                - unit: ZTFT2Tabulator
                t2_dependency:
                - config: *digest_config
                  link_override:
                    filter: LSSTObjFilter
                    select: last
                    sort: diaObjectId
                  unit: T2DigestRedshifts
                - config: *risedec_config
                  link_override:
                    filter: LSSTObjFilter
                    select: last
                    sort: diaObjectId
                  unit: T2TabulatorRiseDecline
            unit: ZiT1Combiner


- title: Run T2s
  unit: T2Worker
  config:
    send_beacon: false
    raise_exc: true


- title: React
  unit: T3Processor
  config:
    raise_exc: true
    supply:
      unit: T3DefaultBufferSupplier
      config:
        select:
          unit: T3StockSelector
          config:
            channel: ztfrealtimeclass
            # t2_filter:
            #     all_of:
            #       - unit: T2InfantReport
            #         match:
            #           host.redshift:
            #             "$lt": 0.05 
            #       - unit: T2InfantReport
            #         match:
            #           features.features.t_lc:
            #             "$lt": 5. 
            #       - unit: T2InfantReport
            #         match:
            #           host.distance:
            #             "$lt": 10. 
        load:
          unit: T3SimpleDataLoader
          config:
            directives:
              - STOCK
              - T1
              - T2DOC
              - DATAPOINT
            channel: ztfrealtimeclass
        complement: 
        - unit: ZTFCutoutImages
          config:
            eligible: last
        - unit: TNSNames
          config:
            include_report: true
    stage:
      unit: T3SimpleStager
      config:
        execute:
          - unit: PlotTransientLightcurves
            config:
              pdf_path: /Users/cristozilleruelo/Ampel-HU-astro/examples_output/IceCube-260115A.pdf
              save_png: false
              include_cutouts: true
              tabulator:
              - unit: ZTFT2Tabulator
              