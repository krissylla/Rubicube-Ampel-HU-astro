name: icecube-healpix
mongo:
  prefix: dumpme
  reset: true
channel:
- name: icecube_kafka
  access:
  - ZTF
  - ZTF_PUB
  - ZTF_PRIV
  policy: []
task:
- title: token
  unit: T4Processor
  config:
    raise_exc: true
    execute:
    - unit: T4RunTimeContextUpdater
      config:
        execute:
        - unit: HealpixTokenGenerator
          config:
            pvalue_limit: 0.09
            map_name: IceCube-260115A_skymap_probdensity_multiorder.fits.gz
            map_url: https://roc-2.icecube.wisc.edu/public/alerts/IceCube-260115A_skymap_probdensity_multiorder.fits.gz
            map_dir: /Users/cristozilleruelo/Ampel-HU-astro/RubiCube/ic_alerts_temp
            date_str: '2026-01-15'
            delta_time: 5.0
            archive_token:
              label: ztf/archive/token
- title: LensFilter
  template:
    live:
    - resolve_run_time_aliases
    - hash_t2_config
  unit: AlertConsumer
  config:
    iter_max: 100000000
    supplier:
      unit: ZiAlertSupplier
      config:
        deserialize: null
        loader:
          unit: ZTFArchiveAlertLoader
          config:
            stream: '%%ztf_stream_token'
    shaper: ZiDataPointShaper
    directives:
    - channel: icecube_kafka
      filter:
        config:
          gaia_excessnoise_sig_max: 999
          gaia_plx_signif: 3
          gaia_pm_signif: 3
          gaia_rs: 20
          gaia_veto_gmag_max: 20
          gaia_veto_gmag_min: 9
          min_ndet: 1
          min_tspan: -99
          max_tspan: 99
          min_archive_tspan: -99
          max_archive_tspan: 100
          min_drb: 0.995
          min_gal_lat: 14
          min_rb: 0.3
          min_sso_dist: 20
          ps1_confusion_rad: 3
          ps1_confusion_sg_tol: 0.1
          ps1_sgveto_rad: 1
          ps1_sgveto_th: 0.8
          max_fwhm: 5.5
          max_elong: 2
          max_magdiff: 1
          max_nbad: 2
        on_stock_match: bypass
        unit: DecentFilter
      ingest:
        mux:
          combine:
          - state_t2:
            - config: &id001
                max_redshift_category: 6
                t2_dependency:
                - config: &id003
                    catalogs:
                      GLADEv23:
                        keys_to_append:
                        - z
                        - dist
                        - dist_err
                        - flag1
                        - flag2
                        - flag3
                        rs_arcsec: 10
                        use: extcats
                      NEDz:
                        keys_to_append:
                        - ObjType
                        - Velocity
                        - z
                        rs_arcsec: 10.0
                        use: catsHTM
                      NEDz_extcats:
                        keys_to_append:
                        - ObjType
                        - Velocity
                        - z
                        post_filter:
                          z:
                            $gte: 0.002
                            $lte: 0.03
                        pre_filter: null
                        rs_arcsec: 60.0
                        use: extcats
                      SDSS_spec:
                        keys_to_append:
                        - z
                        - bptclass
                        - subclass
                        rs_arcsec: 10.0
                        use: extcats
                      LSPhotoZZou:
                        all: true
                        keys_to_append:
                        - photoz
                        - ra
                        - dec
                        - e_photoz
                        - specz
                        - _6
                        - logMassBest
                        - logMassInf
                        - logMassSup
                        rs_arcsec: 30.0
                        use: extcats
                      twoMPZ:
                        all: true
                        keys_to_append:
                        - zPhoto
                        - ra
                        - dec
                        - zSpec
                        rs_arcsec: 30.0
                        use: extcats
                      wiseScosPhotoz:
                        all: true
                        keys_to_append:
                        - zPhoto_Corr
                        - ra
                        - dec
                        - wiseID
                        - w1mCorr
                        - w2mCorr
                        rs_arcsec: 30.0
                        use: extcats
                      PS1_photoz:
                        keys_to_append:
                        - raMean
                        - decMean
                        - z_phot
                        - z_photErr
                        - z_phot0
                        - _2
                        rs_arcsec: 10.0
                        use: extcats
                        pre_filter: null
                        post_filter: null
                  link_override:
                    filter: PPSFilter
                    select: first
                    sort: jd
                  unit: T2CatalogMatch
              unit: T2DigestRedshifts
            - config: &id002
                explosion_time_jd: StockTriggerTime
                max_ampelz_group: 7
                redshift_kind: T2DigestRedshifts
                t2_dependency:
                - config: *id001
                  unit: T2DigestRedshifts
                - unit: T2PropagateStockInfo
                tabulator:
                - unit: ZTFT2Tabulator
                plot_props:
                  file_name:
                    format_str: '%s_%s_%s.svg'
                    arg_keys:
                    - stock
                    - model
                    - redshift_kind
                  title:
                    format_str: '%s %s %s'
                    arg_keys:
                    - stock
                    - model
                    - redshift_kind
                  fig_text:
                    format_str: "%s %s \nz-source %s \nchisq %.2f ndof %s"
                    arg_keys:
                    - stock
                    - model
                    - redshift_kind
                    - chisq
                    - ndof
                  width: 10
                  height: 6
                  id_mapper: null
                  disk_save: ./tmp/
              unit: T2RunPossis
            - config:
                max_redshift: 0.2
                t2_dependency:
                - config: *id001
                  unit: T2DigestRedshifts
                - unit: T2PropagateStockInfo
                - unit: T2RunPossis
                  config: *id002
              unit: T2KilonovaEval
            unit: ZiT1Combiner
          insert:
            point_t2:
            - config: *id003
              ingest:
                filter: PPSFilter
                select: first
                sort: jd
              unit: T2CatalogMatch
          unit: ZiArchiveMuxer
          config:
            future_days: 50
            history_days: 50
        stock_t2:
        - unit: T2PropagateStockInfo
          config:
            prop_paths:
              trigger_time:
              - journal
              - healpix
              - trigger_time
              prob_contour:
              - journal
              - healpix
              - cumprob
              healpix_map:
              - journal
              - healpix
              - map_name
- title: Run T2s
  unit: T2Worker
  config:
    send_beacon: false
    raise_exc: true
- title: React
  unit: T3Processor
  config:
    raise_exc: true
    execute:
    - unit: T3ReviewUnitExecutor
      config:
        supply:
          unit: T3DefaultBufferSupplier
          config:
            select:
              unit: T3StockSelector
              config:
                channel: icecube_kafka
            load:
              unit: T3SimpleDataLoader
              config:
                directives:
                - STOCK
                - T1
                - T2DOC
                channel: icecube_kafka
        stage:
          unit: T3SimpleStager
          config:
            execute:
            - unit: PlotTransientLightcurves
              config:
                pdf_path: /Users/cristozilleruelo/Ampel-HU-astro/examples_output/IceCube-260115A.pdf
                save_png: false
                include_cutouts: true
                slack_channel: null
                slack_token: null
                tabulator:
                - unit: ZTFT2Tabulator
