name: icecube-healpix

mongo: #database used
  prefix: dumpme #data saved under this prefix
  reset: true #database is deleted when running this file. 

channel: #name of the analisys. Used to keep track of the different work being done in the same transient data
- name: icecube_kafka
  access: [ZTF, ZTF_PUB, ZTF_PRIV]
  policy: []



task: 
